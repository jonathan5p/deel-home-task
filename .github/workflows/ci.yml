name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
      - name: uv.lock matches pyproject.toml
        run: uv lock --check
      - name: ruff check
        run: uv run --frozen ruff check
      - name: ruff format --check
        run: uv run --frozen ruff format --check

  container-checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check: [typecheck, test]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the app image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/spark/Dockerfile
          target: app
          tags: ci-spark-app
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build the API dev image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/api/Dockerfile
          target: dev
          tags: ci-api-dev
          load: true
          cache-from: type=gha,scope=api-dev
          cache-to: type=gha,mode=max,scope=api-dev
      - name: make ${{ matrix.check }}
        run: make ${{ matrix.check }} APP_BUILD= CHECKS_PROJECT=ci PYTEST_WORKERS=auto
      - name: Combine the coverage of both images
        if: matrix.check == 'test'
        run: make coverage-report APP_BUILD= CHECKS_PROJECT=ci
      - name: Write the coverage badge
        if: matrix.check == 'test'
        run: |
          mkdir -p target/coverage/badge
          jq '{schemaVersion: 1, label: "coverage", message: .totals.percent_covered_display + "%",
               color: (if .totals.percent_covered >= 90 then "brightgreen" else "red" end)}' \
            target/coverage/coverage.json > target/coverage/badge/coverage.json
          cat target/coverage/badge/coverage.json
      - uses: actions/upload-artifact@v7
        if: matrix.check == 'test' && github.event_name == 'push'
        with:
          name: coverage-badge
          path: target/coverage/badge/coverage.json
          retention-days: 90
