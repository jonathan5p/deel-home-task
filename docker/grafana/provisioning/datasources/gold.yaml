apiVersion: 1

datasources:
  - name: Gold
    uid: gold
    type: grafana-postgresql-datasource
    access: proxy
    url: analytics-db:5432
    user: $GRAFANA_READER_USER
    isDefault: true
    editable: false
    jsonData:
      database: $ANALYTICS_DB_NAME
      sslmode: disable
      postgresVersion: 1800
    secureJsonData:
      password: $GRAFANA_READER_PASSWORD
