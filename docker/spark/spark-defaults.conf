# Drivers always write event logs, so the optional history server can show applications that
# ran while it was stopped. Rolling keeps long-running streaming logs in bounded files.
spark.eventLog.enabled            true
spark.eventLog.dir                file:///opt/spark/spark-events
spark.eventLog.rolling.enabled    true
spark.eventLog.rolling.maxFileSize 128m
spark.history.fs.logDirectory     file:///opt/spark/spark-events
