# Drivers always write event logs, so the optional history server can show applications that
# ran while it was stopped. Rolling keeps long-running streaming logs in bounded files.
spark.eventLog.enabled            true
spark.eventLog.dir                file:///opt/spark/spark-events
spark.eventLog.rolling.enabled    true
spark.eventLog.rolling.maxFileSize 128m
spark.history.fs.logDirectory     file:///opt/spark/spark-events
spark.history.fs.cleaner.enabled  true
spark.history.fs.cleaner.maxAge   30d

# Iceberg catalog "lake": table metadata in the analytics PostgreSQL, data files in the SeaweedFS lake bucket.
# Credentials come from the driver's environment through Spark's ${env:...} substitution.
spark.sql.extensions                          org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.lake                        org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lake.type                   jdbc
spark.sql.catalog.lake.uri                    jdbc:postgresql://analytics-db:5432/iceberg_catalog
spark.sql.catalog.lake.jdbc.user              ${env:ANALYTICS_DB_USER}
spark.sql.catalog.lake.jdbc.password          ${env:ANALYTICS_DB_PASSWORD}
spark.sql.catalog.lake.jdbc.schema-version    V1
spark.sql.catalog.lake.warehouse              s3://lake/warehouse
spark.sql.catalog.lake.io-impl                org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lake.s3.endpoint            http://seaweedfs:8333
spark.sql.catalog.lake.s3.path-style-access   true
spark.sql.catalog.lake.s3.access-key-id       ${env:LAKE_S3_ACCESS_KEY}
spark.sql.catalog.lake.s3.secret-access-key   ${env:LAKE_S3_SECRET_KEY}
spark.sql.catalog.lake.client.region          us-east-1

# S3A filesystem for plain files and streaming checkpoints in the SeaweedFS lake bucket (s3a://lake/...).
spark.hadoop.fs.s3a.endpoint                  http://seaweedfs:8333
spark.hadoop.fs.s3a.endpoint.region           us-east-1
spark.hadoop.fs.s3a.path.style.access         true

# Prometheus metrics (sinks in metrics.properties). The fixed namespace replaces the application id
# in the metric names, so a driver's series continue across restarts.
spark.metrics.namespace                       spark
spark.sql.streaming.metricsEnabled            true
spark.executor.processTreeMetrics.enabled     true
