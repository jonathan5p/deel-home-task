name = "products"
key = "product_id"
description = "Products that can be ordered, with their unit price"
audit_columns = true

[columns.product_id]
type = "bigint"
not_null = true
description = "Product identifier, the source table's primary key"

[columns.product_name]
type = "varchar"
not_null = true
description = "Name of the product"

[columns.barcode]
type = "varchar"
not_null = true
description = "Barcode of the product"

[columns.unity_price]
type = "decimal"
not_null = true
description = "Unit price of the product, decoded from Debezium's variable-scale decimal"

[columns.is_active]
type = "boolean"
description = "Whether the product is active"
