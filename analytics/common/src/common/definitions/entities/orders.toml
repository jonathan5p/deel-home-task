name = "orders"
key = "order_id"
description = "Orders placed by customers, with their status and dates"
audit_columns = true

[columns.order_id]
type = "bigint"
not_null = true
description = "Order identifier, the source table's primary key"

[columns.order_date]
type = "date"
description = "Date the order was placed"

[columns.delivery_date]
type = "date"
description = "Date the order is or was delivered"

[columns.customer_id]
type = "bigint"
description = "Customer who placed the order (customers.customer_id)"

[columns.status]
type = "varchar"
description = "Order status as recorded in the source, for example PENDING or COMPLETED"
