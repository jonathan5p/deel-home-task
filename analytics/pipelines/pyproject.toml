[project]
name = "pipelines"
version = "0.1.0"
description = "Spark pipelines: Debezium CDC from Kafka into the Iceberg lake and the PostgreSQL gold layer."
requires-python = ">=3.14,<3.15"
dependencies = [
    "common",
    "duckdb>=2.0",
    "jinja2>=3.1",
    "prometheus-client>=0.26",
    "psycopg[binary]>=3.3",
]

[tool.uv.sources]
common = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"
