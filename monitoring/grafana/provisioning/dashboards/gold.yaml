apiVersion: 1

providers:
  - name: Gold
    folder: Gold
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      # A file, not the directory: Grafana walks a directory recursively, so the Spark and lake
      # dashboards in its subdirectory would be loaded into this folder too.
      path: /etc/grafana/dashboards/gold-metrics.json
