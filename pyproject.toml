[project]
name = "deel-pipeline"
version = "0.1.0"
description = "Online analytics pipeline: Debezium CDC from PostgreSQL through Kafka into an Iceberg lake and a PostgreSQL gold layer, with Spark Structured Streaming."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.2",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pipeline"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = ["--strict-markers", "--strict-config"]
