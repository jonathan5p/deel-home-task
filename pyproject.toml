[tool.uv.workspace]
members = ["analytics/api", "analytics/common", "analytics/pipelines"]

[dependency-groups]
dev = [
    "duckdb>=2.0",
    "fastavro>=1.12",
    "httpx2>=2.16",
    "pre-commit>=4.3",
    "pyiceberg[sql-sqlite]>=0.12",
    "pytest>=9.2",
    "pytest-cov>=7.0",
    "pytest-xdist>=3.8",
    "pyyaml>=6.0",
    "ruff>=0.17.4",
    "ty==0.0.98",
]
docs = [
    "mkdocs-gen-files>=0.5",
    "mkdocs-material>=9.6",
    "mkdocs-panzoom-plugin==0.5.3",
]

[tool.pytest.ini_options]
testpaths = ["analytics/api/tests", "analytics/common/tests", "analytics/pipelines/tests", "tests/grafana", "tests/prometheus"]
pythonpath = ["."]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "--cov",
    "--cov-report=term-missing",
]

[tool.coverage.run]
source = ["api", "common", "pipelines"]
branch = true
disable_warnings = ["module-not-imported"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_empty = true
exclude_also = [
    "if TYPE_CHECKING:",
    'if __name__ == "__main__":',
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "ANN",  # type annotations are required everywhere
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplifications
    "PT",   # pytest style
    "RUF",  # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["api", "common", "pipelines", "tests"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.terminal]
error-on-warning = true
