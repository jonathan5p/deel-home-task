site_name: Deel CDC pipeline
site_description: Architecture, design and table reference of the CDC pipeline from PostgreSQL to the Iceberg lake and gold
site_url: https://jonathan5p.github.io/deel-home-task/
repo_url: https://github.com/jonathan5p/deel-home-task
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: target/site
strict: true
dev_addr: 127.0.0.1:8001

validation:
  anchors: warn

nav:
  - Home: README.md
  - Architecture:
      - architecture/overview.md
      - architecture/infrastructure.md
      - architecture/sizing.md
      - architecture/decisions.md
      - architecture/production.md
  - Lakehouse:
      - lakehouse/index.md
      - lakehouse/source-and-cdc.md
      - lakehouse/landing.md
      - lakehouse/bronze.md
      - lakehouse/silver.md
      - Gold:
          - lakehouse/gold/index.md
          - lakehouse/gold/model.md
          - lakehouse/gold/writer.md
      - lakehouse/data-quality.md
  - Serving:
      - serving/api.md
      - serving/grafana.md
      - serving/lake-access.md
  - Operations:
      - operations/running-the-pipeline.md
      - operations/maintenance-and-recovery.md
      - operations/debugging.md
      - operations/configuration.md
  - Development:
      - development/code-layout.md
      - development/table-definitions.md
      - development/testing.md
  - How it was built:
      - process/how-i-worked.md
      - process/ai-agents.md
  - Reference:
      - reference/index.md
      - Bronze: reference/bronze/index.md
      - Silver: reference/silver/index.md
      - Gold: reference/gold/index.md
      - reference/original-readme.md

theme:
  name: material
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - panzoom:
      full_screen: true
      always_show_hint: true
  - gen-files:
      scripts:
        - tools/docs/reference_pages.py

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.magiclink:
      repo_url_shorthand: true
      provider: github
      user: jonathan5p
      repo: deel-home-task
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
