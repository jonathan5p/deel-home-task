site_name: Deel CDC pipeline
site_description: Architecture, design and table reference of the CDC pipeline from PostgreSQL to the Iceberg lake and gold
site_url: https://jonathan5p.github.io/deel-home-task/
repo_url: https://github.com/jonathan5p/deel-home-task
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: target/site
strict: true
dev_addr: 127.0.0.1:8001

validation:
  anchors: warn

nav:
  - Home: README.md
  - Layers:
      - layers/source-and-cdc.md
      - layers/landing.md
      - layers/bronze.md
      - layers/silver.md
      - layers/gold.md
  - Operations:
      - operations/running-the-pipeline.md
      - operations/data-quality.md
      - operations/maintenance-and-recovery.md
      - operations/debugging.md
  - Serving:
      - serving/api.md
      - serving/grafana.md
  - Platform:
      - platform/services.md
      - platform/spark.md
      - configuration.md
  - Development:
      - development/code-layout.md
      - development/table-definitions.md
      - development/testing.md
  - Architecture:
      - architecture/overview.md
      - architecture/sizing.md
      - architecture/decisions.md
      - architecture/gold-model.md
  - Reference:
      - reference/index.md
      - Bronze: reference/bronze/index.md
      - Silver: reference/silver/index.md
      - Gold: reference/gold/index.md
  - original-readme.md

theme:
  name: material
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - gen-files:
      scripts:
        - tools/docs/reference_pages.py

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
