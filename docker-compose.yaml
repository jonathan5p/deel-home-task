x-spark-image: &spark-image
  build:
    context: ./docker/spark
  image: deel-home-task/spark:4.1.4

x-spark-worker: &spark-worker
  <<: *spark-image
  command:
    [
      "/opt/spark/bin/spark-class",
      "org.apache.spark.deploy.worker.Worker",
      "${SPARK_MASTER_URL}",
    ]
  depends_on:
    spark-master:
      condition: service_healthy
  environment:
    SPARK_WORKER_CORES: "2"
    SPARK_WORKER_MEMORY: "2g"
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://localhost:8081/ >/dev/null || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 20s

services:
  transactions-db:
    build:
      context: ./docker/postgres-db
    environment:
      - POSTGRES_USER=finance_db_user
      - POSTGRES_PASSWORD=1234
      - POSTGRES_DB=finance_db
    volumes:
      - pg-data:/var/lib/postgresql/data
      - "${PWD}/db-scripts/initialize_db_ddl.sql:/docker-entrypoint-initdb.d/initialize_db_ddl.sql"
    ports:
      - "5432:5432"
    command: ["postgres", "-c", "wal_level=logical", "-c", "hot_standby=on"]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"

  kafka-connect:
    image: debezium/connect:2.4
    depends_on:
      - kafka
      - transactions-db
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: debezium_connect_configs
      OFFSET_STORAGE_TOPIC: debezium_connect_offsets
      STATUS_STORAGE_TOPIC: debezium_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    ports:
      - "8083:8083"

  debezium-init:
    image: curlimages/curl:latest
    depends_on:
      - kafka-connect
    volumes:
      - "${PWD}/debezium/init-connectors.sh:/init-connectors.sh"
      - "${PWD}/debezium/connectors:/connectors"
    entrypoint: ["/bin/sh", "/init-connectors.sh"]
    restart: "no"

  # Spark standalone cluster
  spark-master:
    <<: *spark-image
    hostname: spark-master
    command:
      ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      SPARK_MASTER_URL: ${SPARK_MASTER_URL}
    ports:
      - "8080:8080"
      # 4040 is the application UI of drivers launched in this container by `make spark-submit`.
      - "4040:4040"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8080/json/ >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  spark-worker-1:
    <<: *spark-worker
    hostname: spark-worker-1
    ports:
      - "8081:8081"

  spark-worker-2:
    <<: *spark-worker
    hostname: spark-worker-2
    ports:
      - "8082:8081"

  # Kafka monitoring console
  conduktor-console:
    image: conduktor/conduktor-console:1.48.1
    profiles: [monitoring]
    depends_on:
      kafka:
        condition: service_started
      conduktor-db:
        condition: service_healthy
    ports:
      - "8090:8080"
    volumes:
      - conduktor-data:/var/conduktor
    environment:
      CDK_DATABASE_URL: "postgresql://conduktor:local-metadata-only@conduktor-db:5432/conduktor"
      CDK_ORGANIZATION_NAME: "deel-home-task"
      CDK_ADMIN_EMAIL: "admin@local.test"
      CDK_ADMIN_PASSWORD: "LocalConsole123!"
      CDK_CLUSTERS_0_ID: "deel-kafka"
      CDK_CLUSTERS_0_NAME: "Deel Kafka Cluster"
      CDK_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:29092"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8080/platform/api/modules/health/live || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  conduktor-db:
    image: postgres:16.8
    profiles: [monitoring]
    environment:
      POSTGRES_DB: "conduktor"
      POSTGRES_USER: "conduktor"
      POSTGRES_PASSWORD: "local-metadata-only"
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
    volumes:
      - conduktor-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conduktor -d conduktor"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg-data:
  conduktor-pg-data:
  conduktor-data:
