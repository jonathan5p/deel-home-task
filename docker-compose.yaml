x-spark-image: &spark-image
  image: ${COMPOSE_PROJECT_NAME}-spark

x-spark-worker: &spark-worker
  <<: *spark-image
  command:
    [
      "/opt/spark/bin/spark-class",
      "org.apache.spark.deploy.worker.Worker",
      "${SPARK_MASTER_URL}",
    ]
  depends_on:
    spark-master:
      condition: service_healthy
  environment:
    SPARK_WORKER_CORES: "5"
    SPARK_WORKER_MEMORY: "5g"
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://localhost:8081/ >/dev/null || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 20s

x-spark-app: &spark-app
  image: ${COMPOSE_PROJECT_NAME}-spark-app
  environment:
    SPARK_MASTER_URL: ${SPARK_MASTER_URL}
    ANALYTICS_DB_URL: ${ANALYTICS_DB_URL}
    ANALYTICS_DB_USER: ${ANALYTICS_DB_USER}
    ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD}
    LAKE_S3_ACCESS_KEY: ${LAKE_S3_ACCESS_KEY}
    LAKE_S3_SECRET_KEY: ${LAKE_S3_SECRET_KEY}
    KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    KAFKA_TOPICS: ${KAFKA_TOPICS}
    LAKE_ROOT: ${LAKE_ROOT}
    ICEBERG_CATALOG: ${ICEBERG_CATALOG}
    CHECKPOINT_ROOT: ${CHECKPOINT_ROOT:-}
    LANDING_TRIGGER_SECONDS: ${LANDING_TRIGGER_SECONDS:-}
    BRONZE_TRIGGER_SECONDS: ${BRONZE_TRIGGER_SECONDS:-}
    SILVER_TRIGGER_SECONDS: ${SILVER_TRIGGER_SECONDS:-}
    GOLD_TRIGGER_SECONDS: ${GOLD_TRIGGER_SECONDS:-}
    GOLD_RETENTION_MONTHS: ${GOLD_RETENTION_MONTHS:-}
    GOLD_PARTITION_MONTHS_AHEAD: ${GOLD_PARTITION_MONTHS_AHEAD:-}
    GOLD_RETENTION_INTERVAL_HOURS: ${GOLD_RETENTION_INTERVAL_HOURS:-}
    LANDING_CHECK_LAST_OFFSETS: ${LANDING_CHECK_LAST_OFFSETS:-}
    MAINTENANCE_NAMESPACES: ${MAINTENANCE_NAMESPACES:-}
    MAINTENANCE_SNAPSHOT_RETENTION_HOURS: ${MAINTENANCE_SNAPSHOT_RETENTION_HOURS:-}
    MAINTENANCE_RETAIN_LAST: ${MAINTENANCE_RETAIN_LAST:-}
    MAINTENANCE_ORPHAN_AGE_HOURS: ${MAINTENANCE_ORPHAN_AGE_HOURS:-}
    MAINTENANCE_DOWNSTREAM_CHECKPOINTS: ${MAINTENANCE_DOWNSTREAM_CHECKPOINTS:-}
    MAINTENANCE_INTERVAL_HOURS: ${MAINTENANCE_INTERVAL_HOURS:-}
  volumes:
    - spark-events:/opt/spark/spark-events

x-pipeline-submit: &pipeline-submit >-
  exec /opt/spark/bin/spark-submit
  --master "$$SPARK_MASTER_URL"
  --conf spark.driver.host="$$(hostname)"
  --conf spark.cores.max=2
  --conf spark.hadoop.fs.s3a.access.key="$$LAKE_S3_ACCESS_KEY"
  --conf spark.hadoop.fs.s3a.secret.key="$$LAKE_S3_SECRET_KEY"
  --py-files /opt/app/packages.zip
  "$$@"

x-pipeline-job: &pipeline-job
  <<: *spark-app
  profiles: [pipeline]
  restart: unless-stopped
  depends_on:
    spark-master:
      condition: service_healthy
    spark-worker-1:
      condition: service_healthy
    spark-worker-2:
      condition: service_healthy
    kafka:
      condition: service_started
    seaweedfs:
      condition: service_healthy
    analytics-db:
      condition: service_healthy

services:
  transactions-db:
    build:
      context: ./docker/postgres-db
    environment:
      - POSTGRES_USER=finance_db_user
      - POSTGRES_PASSWORD=1234
      - POSTGRES_DB=finance_db
    volumes:
      - pg-data:/var/lib/postgresql/data
      - "${PWD}/db-scripts/initialize_db_ddl.sql:/docker-entrypoint-initdb.d/initialize_db_ddl.sql"
    ports:
      - "5432:5432"
    command: ["postgres", "-c", "wal_level=logical", "-c", "hot_standby=on"]

  analytics-db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${ANALYTICS_DB_USER}
      POSTGRES_PASSWORD: ${ANALYTICS_DB_PASSWORD}
      POSTGRES_DB: ${ANALYTICS_DB_NAME}
      API_READER_USER: ${API_READER_USER}
      API_READER_PASSWORD: ${API_READER_PASSWORD}
      GRAFANA_READER_USER: ${GRAFANA_READER_USER}
      GRAFANA_READER_PASSWORD: ${GRAFANA_READER_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - analytics-pg-data:/var/lib/postgresql
      - ./docker/analytics-db/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
      target: runtime
    image: ${COMPOSE_PROJECT_NAME}-api
    environment:
      ANALYTICS_DB_URL: ${ANALYTICS_DB_URL}
      ANALYTICS_DB_USER: ${API_READER_USER}
      ANALYTICS_DB_PASSWORD: ${API_READER_PASSWORD}
    ports:
      - "8000:8000"
    depends_on:
      analytics-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  seaweedfs:
    image: chrislusf/seaweedfs:4.52
    command: ["mini", "-dir=/data", "-bucket=lake"]
    environment:
      AWS_ACCESS_KEY_ID: ${LAKE_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${LAKE_S3_SECRET_KEY}
    ports:
      - "8333:8333"
      - "8888:8888"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8888/buckets/lake/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-connect:
    image: debezium/connect:2.4
    depends_on:
      - kafka
      - transactions-db
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: debezium_connect_configs
      OFFSET_STORAGE_TOPIC: debezium_connect_offsets
      STATUS_STORAGE_TOPIC: debezium_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    ports:
      - "8083:8083"

  debezium-init:
    image: curlimages/curl:latest
    depends_on:
      - kafka-connect
    volumes:
      - "${PWD}/debezium/init-connectors.sh:/init-connectors.sh"
      - "${PWD}/debezium/connectors:/connectors"
    entrypoint: ["/bin/sh", "/init-connectors.sh"]
    restart: "no"

  # Spark standalone cluster
  spark-master:
    <<: *spark-image
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
      target: spark
    hostname: spark-master
    command:
      ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8080/json/ >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  spark-app:
    <<: *spark-app
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
      target: app
    profiles: [app]

  api-dev:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
      target: dev
    image: ${COMPOSE_PROJECT_NAME}-api-dev
    environment:
      ANALYTICS_DB_URL: ${ANALYTICS_DB_URL}
    profiles: [app]

  spark-worker-1:
    <<: *spark-worker
    hostname: spark-worker-1
    ports:
      - "8081:8081"

  spark-worker-2:
    <<: *spark-worker
    hostname: spark-worker-2
    ports:
      - "8082:8081"

  landing-job:
    <<: *pipeline-job
    hostname: landing-job
    command: [sh, -c, *pipeline-submit, spark-submit, /opt/app/analytics/pipelines/src/pipelines/landing/job.py]
    ports:
      - "4040:4040"

  bronze-job:
    <<: *pipeline-job
    hostname: bronze-job
    command: [sh, -c, *pipeline-submit, spark-submit, /opt/app/analytics/pipelines/src/pipelines/bronze/job.py]
    ports:
      - "4041:4040"

  silver-job:
    <<: *pipeline-job
    hostname: silver-job
    command: [sh, -c, *pipeline-submit, spark-submit, /opt/app/analytics/pipelines/src/pipelines/silver/job.py]
    ports:
      - "4042:4040"

  lake-views:
    <<: *pipeline-job
    hostname: lake-views
    restart: on-failure
    command: [sh, -c, *pipeline-submit, spark-submit, /opt/app/analytics/pipelines/src/pipelines/silver/views_job.py]

  gold-job:
    <<: *pipeline-job
    hostname: gold-job
    command: [sh, -c, *pipeline-submit, spark-submit, /opt/app/analytics/pipelines/src/pipelines/gold/job.py]
    ports:
      - "4045:4040"

  maintenance-job:
    <<: *spark-app
    profiles: [maintenance]
    hostname: maintenance-job
    restart: unless-stopped
    depends_on:
      spark-master:
        condition: service_healthy
      spark-worker-1:
        condition: service_healthy
      spark-worker-2:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      analytics-db:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        hours="$${MAINTENANCE_INTERVAL_HOURS:-24}"
        case "$$hours" in
          ''|*[!0-9]*|0) echo "MAINTENANCE_INTERVAL_HOURS=$$hours is not a positive integer" >&2; exit 1 ;;
        esac
        while true; do
          /opt/spark/bin/spark-submit \
            --master "$$SPARK_MASTER_URL" \
            --conf spark.driver.host="$$(hostname)" \
            --conf spark.cores.max=2 \
            --conf spark.hadoop.fs.s3a.access.key="$$LAKE_S3_ACCESS_KEY" \
            --conf spark.hadoop.fs.s3a.secret.key="$$LAKE_S3_SECRET_KEY" \
            --py-files /opt/app/packages.zip \
            /opt/app/analytics/pipelines/src/pipelines/maintenance/job.py \
            || echo "Lake maintenance failed; the next run starts in $$hours hours" >&2
          sleep "$$((hours * 3600))"
        done
    ports:
      - "4044:4040"

  gold-retention-job:
    <<: *spark-app
    profiles: [maintenance]
    hostname: gold-retention-job
    restart: unless-stopped
    depends_on:
      analytics-db:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        hours="$${GOLD_RETENTION_INTERVAL_HOURS:-24}"
        case "$$hours" in
          ''|*[!0-9]*|0) echo "GOLD_RETENTION_INTERVAL_HOURS=$$hours is not a positive integer" >&2; exit 1 ;;
        esac
        while true; do
          python -m pipelines.gold.retention \
            || echo "Gold retention failed; the next run starts in $$hours hours" >&2
          sleep "$$((hours * 3600))"
        done

  # Optional: Spark history server
  spark-history:
    <<: *spark-image
    profiles: [history]
    command:
      [
        "/opt/spark/bin/spark-class",
        "org.apache.spark.deploy.history.HistoryServer",
      ]
    ports:
      - "18080:18080"
    volumes:
      - spark-events:/opt/spark/spark-events
    healthcheck:
      test:
        ["CMD-SHELL", "curl -fsS http://localhost:18080/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  grafana:
    image: grafana/grafana-oss:13.0.2
    depends_on:
      analytics-db:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/gold-metrics.json
      ANALYTICS_DB_NAME: ${ANALYTICS_DB_NAME}
      GRAFANA_READER_USER: ${GRAFANA_READER_USER}
      GRAFANA_READER_PASSWORD: ${GRAFANA_READER_PASSWORD}
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Kafka monitoring console
  conduktor-console:
    image: conduktor/conduktor-console:1.48.1
    profiles: [monitoring]
    depends_on:
      kafka:
        condition: service_started
      conduktor-db:
        condition: service_healthy
    ports:
      - "8090:8080"
    volumes:
      - conduktor-data:/var/conduktor
    environment:
      CDK_DATABASE_URL: "postgresql://conduktor:local-metadata-only@conduktor-db:5432/conduktor"
      CDK_ORGANIZATION_NAME: "deel-home-task"
      CDK_ADMIN_EMAIL: "admin@local.test"
      CDK_ADMIN_PASSWORD: "LocalConsole123!"
      CDK_CLUSTERS_0_ID: "deel-kafka"
      CDK_CLUSTERS_0_NAME: "Deel Kafka Cluster"
      CDK_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:29092"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8080/platform/api/modules/health/live || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  conduktor-db:
    image: postgres:16.8
    profiles: [monitoring]
    environment:
      POSTGRES_DB: "conduktor"
      POSTGRES_USER: "conduktor"
      POSTGRES_PASSWORD: "local-metadata-only"
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
    volumes:
      - conduktor-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conduktor -d conduktor"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg-data:
  zookeeper-data:
  zookeeper-log:
  kafka-data:
  analytics-pg-data:
  seaweedfs-data:
  conduktor-pg-data:
  conduktor-data:
  spark-events:
  grafana-data:
